<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Category Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div id="site-name">
        <h1>ShopMaster</h1>
    </div>
    <!-- Desktop Category Menu -->
    <ul id="category-menu">
        <li onclick="filterCategory('all')">All</li>
        <li onclick="filterCategory('mobiles')">Mobiles</li>
        <li onclick="filterCategory('laptops')">Laptops</li>
        <li onclick="filterCategory('accessories')">Accessories</li>
        <li onclick="filterCategory('food')">Food</li>
        <li onclick="filterCategory('electronics')">Electronics</li>
    </ul>
    <!-- Mobile Hamburger Menu -->
    <div id="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</div>
    <!-- Mobile Category Menu Dropdown -->
    <ul id="mobile-category-menu">
        <li onclick="filterCategory('all')">All</li>
        <li onclick="filterCategory('mobiles')">Mobiles</li>
        <li onclick="filterCategory('laptops')">Laptops</li>
        <li onclick="filterCategory('accessories')">Accessories</li>
        <li onclick="filterCategory('food')">Food</li>
        <li onclick="filterCategory('electronics')">Electronics</li>
    </ul>
    <div id="cart-icon" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</div>
  </header>

  <main id="main-content">
    <div id="cart-panel">
      <h3>Your Cart</h3>
      <div id="cart-items"></div>
      <div>Total: ₹<span id="cart-total">0.00</span></div>
      <div class="button-container">
        <button id="clear-cart">Clear Cart</button>
        <button id="checkout-btn">Checkout</button>
      </div>
    </div>

    <div id="product-list">
      <!-- Product list will be dynamically generated here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
